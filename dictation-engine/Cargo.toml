[package]
publish = false
name = "dictation-engine"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = ["pipewire", "tray", "correction"]
pipewire = ["dep:pipewire"]
tray = ["dep:ksni"]
correction = ["dep:correction-engine"]

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }

slint-gui = { path = "../slint-gui" }
dictation-types = { path = "../dictation-types" }
shellexpand = "3"
cpal = "0.15"
toml = "0.8"
harper-core = "0.68"
zbus = "5"
systemd = "0.10"
dirs = "5"
xdg-paths = "0.2.0"
logind-session = "0.2.0"
notify = "6"
hound = "3.5"
# Fuzzy vocabulary matching (Jaro-Winkler / Levenshtein) for post-correction
strsim = "0.11"
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }
# Silero VAD (neural voice activity detection)
# NOTE: Keep exact versions aligned with parakeet-rs requirements
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "=0.16.1"
# Parakeet engine
parakeet-rs = { version = "0.2", default-features = false, features = ["cpu"] }
# Tokenizer for CTC beam search hotword processing
tokenizers = { version = "0.22.2", features = ["onig"] }
# FFT for mel spectrogram extraction in CtcDirectEngine
rustfft = "6.4"
# SHA256 verification for VAD model
sha2 = "0.10"
hex = "0.4"
# SigV4 request signing for the Bedrock llm_correction stage
hmac = "0.12"
# WebSocket transport for the OpenAI realtime transcription engine
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
base64 = "0.22"
# VAD model download
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
# PipeWire native audio backend
# 0.10+ required: older releases pin bindgen 0.69, which generates broken
# (opaque) bindings with libclang >= 19 and fails against PipeWire 1.6 headers.
pipewire = { version = "0.10", optional = true }
# System tray (StatusNotifierItem)
ksni = { git = "https://github.com/iovxw/ksni.git", rev = "4d2320c", optional = true }
futures-util = "0.3"
# AT-SPI2 correction learning (optional)
correction-engine = { path = "../correction-engine", optional = true }
# zwp_input_method_v2 diagnostic probe (`voice-dictation debug ime-probe`)
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
libc = "0.2"

[dev-dependencies]
# Guards that exactly one rustls crypto provider is selectable (wss:// panics otherwise)
rustls = { version = "0.23", default-features = false }
tempfile = "3"

[lib]
name = "dictation_engine"
path = "src/lib.rs"
