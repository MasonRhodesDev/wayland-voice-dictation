[package]
publish = false
name = "slint-gui"
version = "0.2.0"
edition = "2021"
license.workspace = true
description = "Slint-based GUI overlay for voice dictation"

[dependencies]
slint = "=1.17.1"
slint-interpreter = { version = "=1.17.1", default-features = false, features = ["compat-1-2"] }
hypr-slint-runtime = { git = "https://github.com/MasonRhodesDev/hypr-slint-runtime", tag = "v0.1.0" }
tokio = { version = "1", features = ["sync", "rt", "net", "time", "io-util"] }
tracing = "0.1"
dictation-types = { path = "../dictation-types" }
notify = "6"

[target.'cfg(target_os = "linux")'.dependencies]
layer-shika = "0.2"
hypr-ipc = "0.1.0"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "=1.17.1", features = ["unstable-winit-030"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
