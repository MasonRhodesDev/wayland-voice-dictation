# cargo-deny configuration — supply-chain gate for a daemon that types into
# arbitrary windows. Run locally with `cargo deny check`; CI runs it on PRs,
# pushes, and weekly.

[advisories]
version = 2
yanked = "deny"
# Add RUSTSEC IDs here (with a justifying comment) only if an advisory is
# confirmed not to affect us and a fix isn't yet available.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained compile-time-only proc-macro (slint dep); no runtime exposure" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.x unmaintained; used only for local model-cache serialization of trusted data" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; renders local trusted fonts only (slint text stack)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; shapes local trusted text only (slint text stack), same rationale as ttf-parser" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml duplicate-attr quadratic scan; we never parse untrusted XML, fix needs semver-major of transitive dep" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader allocation DoS; same trusted-input rationale as 2026-0194" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (folded into zbus 6); held on zbus 5 by accesskit, atspi, slint and ksni, no fix until they move" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; same zbus 5 pin as 2026-0370" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; same zbus 5 pin as 2026-0370" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained; reached only through slint's spin_on, no upgrade available" },
]

[licenses]
version = 2
# Set actually present in the tree (see `cargo metadata`). Beyond the usual
# permissive licenses this GUI/audio/ML dependency tree pulls in:
#   - MPL-2.0 (cssparser, option-ext, colored) — file-level copyleft, fine
#     for an unmodified dependency in a binary.
#   - GPL-3.0 (slint under its GPL option, hyprland-rs) and AGPL-3.0
#     (layer-shika) — the shipped binary is effectively (A)GPL-3 as a
#     combined work; acceptable for this open-source project since the full
#     source is published.
#   - LGPL-2.1 WITH GCC-exception-2.0 (systemd/libsystemd-sys bindings).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
    "LGPL-2.1-or-later WITH GCC-exception-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates (dictation-engine, slint-gui, ...) are path deps
# with no version — that's a "wildcard" to cargo-deny. Exempt local path
# deps; still catch a real `foo = "*"` registry wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Pinned/owned git dependencies (also vendored into the SRPM by
# packaging/build-srpm.sh):
#   - schema-tui: our own config-TUI crate
#   - ksni: tray crate pinned to a rev for a fix not yet on crates.io
#   - hypr-slint-runtime: owned shared runtime; Cargo.toml pins v0.1.0 and
#     Cargo.lock pins commit 2c18ead7, while allow-git matches repository URLs
allow-git = [
    "https://github.com/MasonRhodesDev/schema-tui.git",
    "https://github.com/iovxw/ksni.git",
    "https://github.com/MasonRhodesDev/hypr-slint-runtime",
]
