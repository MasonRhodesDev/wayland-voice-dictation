[package]
publish = false
name = "voice-dictation"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = ["pipewire", "tray", "correction"]
pipewire = ["dictation-engine/pipewire"]  # Native PipeWire audio backend
tray = ["dictation-engine/tray"]
correction = ["dictation-engine/correction"]  # AT-SPI2 correction learning

[dependencies]
dictation-engine = { path = "dictation-engine", default-features = false }
# CLI management of the learned-corrections store (corrections list/remove/clear)
correction-engine = { path = "correction-engine" }
slint-gui = { path = "slint-gui" }
test-loop-ui = { path = "test-loop-ui" }
schema-tui = { git = "https://github.com/MasonRhodesDev/schema-tui.git", rev = "90bf1526f31cf20852b9c02fb3d17c94746fc425" }
clap = { version = "4", features = ["derive"] }
zbus = "5"
tokio = { workspace = true }
systemd = "0.10"
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[workspace]
members = [
    "dictation-engine",
    "dictation-types",
    "slint-gui",
    "test-loop-ui",
    "correction-engine",
]
resolver = "2"

# Single source of truth for the released version. spec Version, PKGBUILD
# pkgver, and Cargo.lock must match — packaging/build-srpm.sh gates on it.
[workspace.package]
version = "0.7.0"
license = "MIT OR Apache-2.0"

[patch.crates-io]
layer-shika-adapters = { path = "third_party/layer-shika-adapters" }

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
