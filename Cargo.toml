[package]
publish = false
name = "voice-dictation"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = ["pipewire", "tray", "correction"]
pipewire = ["dictation-engine/pipewire"]
tray = ["dictation-engine/tray"]
correction = ["dictation-engine/correction"]

[dependencies]
dictation-engine = { path = "dictation-engine", default-features = false }
correction-engine = { path = "correction-engine" }
test-loop-ui = { path = "test-loop-ui" }
schema-tui = { git = "https://github.com/MasonRhodesDev/schema-tui.git", rev = "90bf1526f31cf20852b9c02fb3d17c94746fc425" }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[workspace]
members = [
    "dictation-engine",
    "dictation-types",
    "slint-gui",
    "test-loop-ui",
    "correction-engine",
]
resolver = "2"

[workspace.package]
version = "0.8.3"
license = "MIT OR Apache-2.0"

[patch.crates-io]
layer-shika-adapters = { path = "third_party/layer-shika-adapters" }

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
